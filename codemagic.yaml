workflows:
  android-workflow:
    name: Fajrak Android Build
    max_build_duration: 60
    environment:
      flutter: 3.24.0
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
