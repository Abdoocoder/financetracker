<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fajrak - Smart Finance Tracker">
  <meta name="theme-color" content="#10B981">
  <title>Fajrak</title>
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <script>
    // Environment variables for web build
    // These are replaced at build time by flutter build web --dart-define
    // For local development, you can override these in browser console or use a .env file
    window.ENV = {
      SUPABASE_URL: '{{SUPABASE_URL}}',
      SUPABASE_ANON_KEY: '{{SUPABASE_ANON_KEY}}',
      FIREBASE_API_KEY: '{{FIREBASE_API_KEY}}',
      FIREBASE_AUTH_DOMAIN: '{{FIREBASE_AUTH_DOMAIN}}',
      FIREBASE_PROJECT_ID: '{{FIREBASE_PROJECT_ID}}',
      FIREBASE_STORAGE_BUCKET: '{{FIREBASE_STORAGE_BUCKET}}',
      FIREBASE_MESSAGING_SENDER_ID: '{{FIREBASE_MESSAGING_SENDER_ID}}',
      FIREBASE_APP_ID: '{{FIREBASE_APP_ID}}',
      FIREBASE_MEASUREMENT_ID: '{{FIREBASE_MEASUREMENT_ID}}',
    };
    
    // Development mode detection
    window.IS_DEV = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    
    // For local development, you can set these in browser console:
    // window.ENV.SUPABASE_URL = 'https://your-project.supabase.co';
    // window.ENV.SUPABASE_ANON_KEY = 'your-anon-key';
  </script>
</head>

<body>
  <script src="main.dart.js" type="application/javascript"></script>
</body>

</html>
