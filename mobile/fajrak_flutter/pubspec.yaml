name: fajrak
description: Smart Finance Tracker - Flutter Mobile App
publish_to: 'none'
version: 3.42.2+57

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Supabase
  supabase_flutter: ^2.3.4

  # Firebase
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0

  # Localization
  easy_localization: ^3.0.3

  # Secure Storage
  flutter_secure_storage: ^11.2.0

  # HTTP & Networking
  http: ^1.2.0
  dio: ^5.4.0

  # Utilities - intl version must match flutter_localizations (0.20.3)
  intl: ^0.20.3
  url_launcher: ^6.2.2
  share_plus: ^13.3.0
  path_provider: ^2.1.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.2

  # UI Components
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^35.1.37
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^4.0.0
  cached_network_image: ^4.0.2
  flutter_svg: ^2.0.9

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1

  # Cryptography
  encrypt: ^5.0.1
  pointycastle: ^3.7.3

  # Local Database (Drift/SQLCipher)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlcipher_flutter_libs: ^0.7.0+eol

  # Environment Variables
  flutter_dotenv: ^6.0.1

  # Web Crypto
  webcrypto: ^0.6.0

  # Local Notifications
  flutter_local_notifications: ^23.0.0-dev.3

  # UUID
  uuid: ^4.3.3

  # Shared Preferences
  shared_preferences: ^2.2.2

  # App Badge Control
  flutter_app_badge_control: ^0.0.2

  # Path
  path: ^1.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700