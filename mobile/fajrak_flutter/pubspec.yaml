name: fajrak
description: فجرك - تطبيق إدارة مالية ذكي
publish_to: 'fajrak.com'
version: 3.42.0+54

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.17.2

  # Firebase - إصدارات متوافقة مع بعض
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # UI
  fl_chart: ^1.2.0
  shimmer: ^4.0.0

  # Utils
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  easy_localization: ^3.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  flutter_app_badge_control: ^0.0.2
  pdf: ^3.13.1
  printing: ^5.15.1
  uuid: ^4.6.0

  # Offline-first local database
  drift: ^2.35.0
  sqlcipher_flutter_libs: ^0.7.0+eol  # SQLCipher encryption — mobile/desktop only
  path: ^1.9.1

  # BYOK — device-only provider keys (Keychain / Android Keystore) — Feature A
  flutter_secure_storage: ^11.2.0
  webcrypto: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
dependency_overrides:
  vector_math: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/i18n/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
