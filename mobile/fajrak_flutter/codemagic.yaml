workflows:
  android-release:
    name: Fajrak Android — Play Store (AAB)
    max_build_duration: 60
    environment:
      flutter: 3.29.0
      groups:
        - fajrak
    scripts:
      - name: Create .env file
        script: |
          cd mobile/fajrak_flutter
          cat > .env << ENVEOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          TWELVE_DATA_KEY=$TWELVE_DATA_KEY
          FLUTTER_FIREBASE_API_KEY=$FLUTTER_FIREBASE_API_KEY
          FLUTTER_FIREBASE_PROJECT_ID=$FLUTTER_FIREBASE_PROJECT_ID
          FLUTTER_FIREBASE_APP_ID=$FLUTTER_FIREBASE_APP_ID
          FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          ENVEOF
      - name: Get Flutter packages
        script: |
          cd mobile/fajrak_flutter
          flutter pub get
      - name: Build App Bundle (AAB) for Play Store
        script: |
          cd mobile/fajrak_flutter
          flutter build appbundle --release
      - name: Build APK for direct download
        script: |
          cd mobile/fajrak_flutter
          flutter build apk --release
    artifacts:
      # AAB → upload this to Google Play Console
      - mobile/fajrak_flutter/build/app/outputs/bundle/release/app-release.aab
      # APK → use for direct download / website
      - mobile/fajrak_flutter/build/app/outputs/flutter-apk/app-release.apk

  android-apk:
    name: Fajrak Android — Direct APK
    max_build_duration: 60
    environment:
      flutter: 3.29.0
      groups:
        - fajrak
    scripts:
      - name: Create .env file
        script: |
          cd mobile/fajrak_flutter
          cat > .env << ENVEOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          TWELVE_DATA_KEY=$TWELVE_DATA_KEY
          FLUTTER_FIREBASE_API_KEY=$FLUTTER_FIREBASE_API_KEY
          FLUTTER_FIREBASE_PROJECT_ID=$FLUTTER_FIREBASE_PROJECT_ID
          FLUTTER_FIREBASE_APP_ID=$FLUTTER_FIREBASE_APP_ID
          FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          ENVEOF
      - name: Get Flutter packages
        script: |
          cd mobile/fajrak_flutter
          flutter pub get
      - name: Build APK
        script: |
          cd mobile/fajrak_flutter
          flutter build apk --release
    artifacts:
      - mobile/fajrak_flutter/build/app/outputs/flutter-apk/app-release.apk
