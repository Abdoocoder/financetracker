name: 'Supabase Daily Backup'

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC = 05:00 Amman
  workflow_dispatch:       # allow manual runs

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client from PGDG
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "=== installed postgresql binaries ==="
          ls -la /usr/lib/postgresql/ 2>&1 || true
          echo "=== pg_dump 17 binary ==="
          ls -la /usr/lib/postgresql/17/bin/pg_dump 2>&1 || true
          echo "=== pg_dump 17 version ==="
          /usr/lib/postgresql/17/bin/pg_dump --version 2>&1 || true
          echo "=== default pg_dump on PATH ==="
          which pg_dump
          /usr/lib/postgresql/17/bin/pg_dump --version 2>&1 || true; echo "---"; pg_dump --version 2>&1 || true

      - name: Create backups
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema-only --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            -f schema.sql
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --data-only --no-owner --no-privileges \
            --schema=public --inserts \
            -f data_public.sql
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --data-only --no-owner --no-privileges \
            --schema=auth --inserts \
            -f data_auth.sql
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            -f full_backup.dump
          ls -lh *.sql *.dump

      - name: Verify sizes (fail if any file is empty)
        run: |
          for f in schema.sql data_public.sql data_auth.sql full_backup.dump; do
            test -s "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All backup files present and non-empty."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: full_backup.dump
          retention-days: 30
