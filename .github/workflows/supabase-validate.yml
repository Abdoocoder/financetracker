name: Supabase Validate (dry-run, prod-safe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Migration structure guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Block real db push across all workflows
        run: |
          set -euo pipefail
          cmd="supabase db ""push"
          dry="--dry-run"
          offenders=""
          for f in .github/workflows/*.yml; do
            [ "$f" = ".github/workflows/supabase-validate.yml" ] && continue
            if rg -q "supabase[[:space:]]+db[[:space:]]+push" "$f"; then
              # Allow only --dry-run. A real push can alter/drop production objects.
              if ! rg -q "supabase[[:space:]]+db[[:space:]]+push[[:space:]]+$dry" "$f"; then
                echo "::error file=$f::Real $cmd (without $dry) is forbidden — prod safety."
                offenders="$offenders $f"
              fi
            fi
          done
          if [ -n "$offenders" ]; then
            echo "::error::Aborting: a real db push was found in:$offenders"
            exit 1
          fi
          echo "OK: no workflow performs a real db push."

      - name: Validate top-level migration naming contract
        run: |
          set -euo pipefail
          cd supabase/migrations
          shopt -s nullglob
          files=(./[0-9]*.sql)
          seen_prefixes=""
          for f in "${files[@]}"; do
            base="${f#./}"
            case "$base" in
              [0-9][0-9][0-9]_*) ;;
              *)
                echo "::error file=supabase/migrations/$base::Invalid name. Expected <NNN>_<snake_case>.sql"
                exit 1
                ;;
            esac
            prefix="${base%%_*}"
            if printf '%s\n' "$seen_prefixes" | rg -qx "$prefix"; then
              echo "::error file=supabase/migrations/$base::Duplicate numeric prefix '$prefix' — migrations collide on replay. Renumber uniquely."
              exit 1
            fi
            seen_prefixes="$(printf '%s\n%s' "$seen_prefixes" "$prefix")"
            echo "  ok: $base"
          done
          echo "OK: $((${#files[@]})) top-level migration(s) conform."

      - name: Verify legacy archive integrity
        run: |
          set -euo pipefail
          count="$(find supabase/migrations/legacy -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          echo "Archived migrations: $count"
          if [ "$count" -ne 42 ]; then
            echo "::warning::Expected 42 archived migrations, found $count. Legacy deck may have drifted."
          fi

  validate-sql:
    # Top-level migrations reference tables created by the archived legacy deck
    # (001–041), which `supabase db start` never replays. So we boot an EMPTY
    # local DB baseline, best-effort-replay the legacy deck onto it via psql
    # (some files touch prod SQL-editor objects, so errors there are tolerated),
    # then STRICTLY APPLY each top-level migration — the real DDL gate — and
    # finally lint the resulting schema as an advisory report. Production is
    # never touched: psql binds to the local throwaway DB only.
    name: Isolated schema check (legacy-seeded local stack)
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Count top-level migrations
        id: count
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/[0-9]*.sql)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.count.outputs.count != '0'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stash top-level migrations for empty baseline boot
        if: steps.count.outputs.count != '0'
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/top-level-migrations
          for f in supabase/migrations/[0-9]*.sql; do
            mv "$f" /tmp/top-level-migrations/
          done
          echo "Stashed $(ls /tmp/top-level-migrations | wc -l) top-level migration(s)."

      - name: Start isolated local database (empty schema baseline)
        if: steps.count.outputs.count != '0'
        run: supabase db start

      # Best-effort replay of the archived legacy deck (001–041). Some files
      # reference objects prod created via the SQL editor (e.g. the
      # delete_user_account(uuid) function ALTERed in 005), which never existed
      # as migrations, so failures are tallied but do not fail the job. The
      # real gate is the strict top-level apply below: if a top-level migration
      # touches a table the deck didn't create, the apply step fails the job.
      - name: Seed archived legacy schema onto local DB (best effort)
        if: steps.count.outputs.count != '0'
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(supabase/migrations/legacy/*.sql)
          [ "${#files[@]}" -eq 0 ] && { echo "No legacy migrations to seed."; exit 0; }
          ok=0; skipped=0
          for f in "${files[@]}"; do
            if docker run --rm -i --network host postgres:17-alpine \
              psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=0 -f - < "$f" >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              echo "  (best effort) skipped errors in: ${f#supabase/migrations/}"
              skipped=$((skipped+1))
            fi
          done
          echo "OK: ${ok}/${#files[@]} legacy migration(s) replay cleanly; ${skipped} reference prod-only objects."

      - name: Restore top-level migrations
        if: steps.count.outputs.count != '0'
        run: |
          shopt -s nullglob
          for f in /tmp/top-level-migrations/[0-9]*.sql; do
            mv "$f" supabase/migrations/
          done
          echo "Restored $(ls supabase/migrations/[0-9]*.sql 2>/dev/null | wc -l) top-level migration(s)."

      # psql APPLIES each top-level migration so DDL failures (missing table/
      # column, bad syntax) abort the job. `db lint` below only scans the live
      # schema for advisories and does NOT execute migration files, so this
      # apply loop is the actual DDL validation. Production is never touched.
      - name: Apply top-level migrations onto local DB
        if: steps.count.outputs.count != '0'
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/[0-9]*.sql)
          [ "${#files[@]}" -eq 0 ] && { echo "No top-level migrations to apply."; exit 0; }
          for f in "${files[@]}"; do
            echo "  applying: ${f#supabase/migrations/}"
            docker run --rm -i --network host postgres:17-alpine \
              psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -f - < "$f" >/dev/null
          done
          echo "OK: ${#files[@]} top-level migration(s) applied onto the local DB."

      # Advisory schema lint. The seeded legacy deck inherently references prod
      # SQL-editor objects (e.g. debts.debt_type, accounts.opening_balance, the
      # get_financial_dashboard function), so pre-existing error-level findings
      # are expected and must not gate the workflow. The real DDL gate for
      # top-level migrations is the strict psql apply step above. `|| true`
      # keeps the report visible in the log without failing the job.
      - name: Lint schema against throwaway local DB only (advisory)
        if: steps.count.outputs.count != '0'
        run: |
          echo "Schema lint (advisory — pre-existing legacy findings expected):"
          supabase db lint --local || true

      - name: Report (no top-level migrations)
        if: steps.count.outputs.count == '0'
        run: echo "No top-level migrations to validate (all are archived under supabase/migrations/legacy/). Skipping isolated schema check."