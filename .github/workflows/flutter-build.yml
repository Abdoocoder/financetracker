name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/fajrak_flutter/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Java
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > mobile/fajrak_flutter/android/app/google-services.json

      - name: Get dependencies
        working-directory: mobile/fajrak_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: mobile/fajrak_flutter
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fajrak-release-${{ github.run_number }}
          path: mobile/fajrak_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
