name: Smart Notifications CRON

# جميع الأوقات بـ UTC (المنطقة الزمنية للخادم UTC+3)
# UTC+3 → UTC: نطرح 3 ساعات
#
# 6 AM UTC+3  = 3 AM UTC  → Morning reminder
# 6 PM UTC+3  = 3 PM UTC = 15:00 UTC → Evening reminder
#
# Reduced from 7x/day to 2x/day to reduce Disk IO (see 2026-10-28 forensics)

on:
  schedule:
    - cron: '0 3 * * *'   # 6 ص: تذكير صباحي + تنبيهات ذكية + ديون مستحقة
    - cron: '0 15 * * *'  # 6 م: تذكير مسائي
  workflow_dispatch:       # تشغيل يدوي للاختبار

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Smart Notifications
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fajrak.com/api/smart-notifications)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Status: $status"
          echo "Response: $body"
          if [ "$status" != "200" ]; then
            echo "❌ Failed with status $status"
            exit 1
          fi
          echo "✅ Notifications triggered successfully"