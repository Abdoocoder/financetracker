<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1729"/>
      <stop offset="100%" style="stop-color:#1a2540"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B7EF6"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="180" fill="rgba(59,126,246,0.06)"/>
  <g filter="url(#glow)" opacity="0.7">
    <line x1="256" y1="80" x2="256" y2="140" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <line x1="340" y1="105" x2="310" y2="158" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <line x1="172" y1="105" x2="202" y2="158" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="180" x2="165" y2="200" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="392" y1="180" x2="347" y2="200" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
  <path d="M 130 310 A 126 126 0 0 1 382 310" fill="none" stroke="url(#sun)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 80 320 Q 256 280 432 320" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <text x="256" y="295" font-family="Arial, sans-serif" font-size="140" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="white" filter="url(#glow)">ف</text>
  <circle cx="256" cy="350" r="12" fill="url(#sun)" filter="url(#glow)"/>
